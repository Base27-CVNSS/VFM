name: VFM 1.3 conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        run: cargo test --all-targets
      - name: Independent Python writer equals golden
        run: |
          python tools/python_reference.py --output /tmp/python-core-minimal.vfm
          cmp /tmp/python-core-minimal.vfm fixtures/golden/core-minimal.vfm
          python tools/verify_independent.py
      - name: Rust writer equals golden
        run: |
          cargo run --quiet --bin vfm -- build-minimal /tmp/rust-core-minimal.vfm
          cmp /tmp/rust-core-minimal.vfm fixtures/golden/core-minimal.vfm
      - name: Validate golden
        run: |
          cargo run --quiet --bin vfm -- validate fixtures/golden/core-minimal.vfm
          cargo run --quiet --bin vfm -- validate fixtures/golden/core-chunked.vfm
